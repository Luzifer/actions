name: Arch PKGBUILD Checksums
description: Update PKGBUILD checksums and commit the result

inputs:
  checkout:
    description: Whether to do the checkout inside this action
    default: 'true'
    required: false
  commit-author:
    description: Commit author used by git-auto-commit-action
    default: Luzifer-CI <ci@luzifer.io>
    required: false
  commit-message:
    description: Commit message for the checksum update
    default: Update PKGBUILD checksums
    required: false
  commit-user-email:
    description: Commit user email used by git-auto-commit-action
    default: ci@luzifer.io
    required: false
  commit-user-name:
    description: Commit user name used by git-auto-commit-action
    default: Luzifer-CI
    required: false

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ inputs.checkout == 'true' }}
      with:
        show-progress: false

    - shell: bash
      run: updpkgsums-builder

    - shell: bash
      run: |
        sed -Ei 's/pkgrel=[0-9]+/pkgrel=1/' PKGBUILD

    - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_author: ${{ inputs.commit-author }}
        commit_message: ${{ inputs.commit-message }}
        commit_user_email: ${{ inputs.commit-user-email }}
        commit_user_name: ${{ inputs.commit-user-name }}
        file_pattern: PKGBUILD
